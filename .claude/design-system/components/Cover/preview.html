<!-- @dsCard height=320 -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:var(--surface-100);}
  .cover{position:relative;width:960px;height:320px;overflow:hidden;background:var(--surface-100);}
  svg{position:absolute;left:0;top:0;}
  .slab{fill:var(--surface-inverse);}
  .volt{fill:var(--voltage);}
  .copper{fill:var(--copper);}
  .steel{fill:var(--steel);}
  .tint{fill:var(--border);}
  .stripe{fill:var(--surface-inverse);}
  .r-md{rx:var(--radius-md);} .r-lg{rx:var(--radius-lg);}
  .name{position:absolute;left:48px;bottom:48px;max-width:440px;}
  .name h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:84px;line-height:.92;color:var(--ink);letter-spacing:.5px;}
  .name p{margin:12px 0 0;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--ink-muted);}
</style>
<div class="cover">
  <svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true">
    <!--
      blocks: surface-inverse slab 192×320 (bleeds top+bottom) · voltage 240×176 · copper 120×96 · steel 72×96 · border-token tint 56×96
      arrangement: one tall Panel-Black slab with satellites, like a load center with breakers; voltage block bleeds off the right edge
      pattern: hazard stripes (loud/bold poster row) — "High-Voltage warning tape" is the README's own motif; 45° bands at space-6 pitch, cut into the voltage block
      scales: gaps space-4 (16), stripe width space-3 (12) at pitch space-6 (24), corners radius-md / radius-lg
    -->
    <defs>
      <clipPath id="vclip"><rect x="696" y="48" width="264" height="176" rx="8"/></clipPath>
    </defs>
    <rect class="slab" x="488" y="-8" width="192" height="336"/>
    <rect class="volt r-lg" x="696" y="48" width="280" height="176"/>
    <g clip-path="url(#vclip)">
      <g transform="translate(696 48) skewX(-45)">
        <rect class="stripe" x="0"   y="128" width="12" height="48"/>
        <rect class="stripe" x="24"  y="128" width="12" height="48"/>
        <rect class="stripe" x="48"  y="128" width="12" height="48"/>
        <rect class="stripe" x="72"  y="128" width="12" height="48"/>
        <rect class="stripe" x="96"  y="128" width="12" height="48"/>
        <rect class="stripe" x="120" y="128" width="12" height="48"/>
        <rect class="stripe" x="144" y="128" width="12" height="48"/>
        <rect class="stripe" x="168" y="128" width="12" height="48"/>
        <rect class="stripe" x="192" y="128" width="12" height="48"/>
        <rect class="stripe" x="216" y="128" width="12" height="48"/>
        <rect class="stripe" x="240" y="128" width="12" height="48"/>
        <rect class="stripe" x="264" y="128" width="12" height="48"/>
        <rect class="stripe" x="288" y="128" width="12" height="48"/>
        <rect class="stripe" x="312" y="128" width="12" height="48"/>
        <rect class="stripe" x="336" y="128" width="12" height="48"/>
        <rect class="stripe" x="360" y="128" width="12" height="48"/>
        <rect class="stripe" x="384" y="128" width="12" height="48"/>
        <rect class="stripe" x="408" y="128" width="12" height="48"/>
      </g>
    </g>
    <rect class="volt r-md" x="520" y="48"  width="128" height="48"/>
    <rect class="copper r-md" x="696" y="240" width="120" height="96"/>
    <rect class="steel r-md" x="832" y="240" width="72" height="96"/>
    <rect class="tint r-md" x="920" y="240" width="56" height="96"/>
  </svg>
  <div class="name">
    <h1>Volt<br>Academy</h1>
    <p>Train like a pro. Work safe. Get licensed.</p>
  </div>
</div>
